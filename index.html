<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Pong</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    .game-wrapper {
      width: min(95vw, 900px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: 4px;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-bottom: 12px;
      font-size: 2rem;
      font-weight: bold;
    }

    .player-label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.75rem;
      color: #9fb3c8;
      letter-spacing: 1px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #05080c;
      border: 3px solid white;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      touch-action: none;
    }

    .controls {
      margin-top: 14px;
      color: #b8c7d9;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    button {
      margin: 5px;
      padding: 10px 20px;
      border: 0;
      border-radius: 5px;
      background: #28a9e0;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #168dc0;
    }

    .mobile-controls {
      display: none;
      justify-content: space-between;
      gap: 30px;
      margin: 14px auto;
    }

    .mobile-player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mobile-player span {
      font-size: 0.75rem;
      color: #9fb3c8;
      letter-spacing: 1px;
    }

    .control-button {
      width: 80px;
      height: 48px;
      margin: 0;
      padding: 0;
      border-radius: 8px;
      font-size: 1.4rem;
      touch-action: none;
      user-select: none;
    }

    .control-button:active {
      background: #168dc0;
      transform: scale(0.96);
    }

    @media (pointer: coarse), (max-width: 700px) {
      .desktop-controls {
        display: none;
      }

      .mobile-controls {
        display: flex;
      }

      h1 {
        font-size: 1.5rem;
      }

      .scoreboard {
        gap: 45px;
        font-size: 1.6rem;
      }

      .controls {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <main class="game-wrapper">
    <h1>PONG</h1>

    <div class="scoreboard">
      <div>
        <span class="player-label">PLAYER 1</span>
        <span id="leftScore">0</span>
      </div>

      <div>
        <span class="player-label">PLAYER 2</span>
        <span id="rightScore">0</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div class="controls">
      <div class="desktop-controls">
        Player 1: <strong>W</strong> / <strong>S</strong>
        &nbsp; | &nbsp;
        Player 2: <strong>↑</strong> / <strong>↓</strong>
        <br>
        Press <strong>Space</strong> to pause or resume
      </div>

      <div class="mobile-controls">
        <div class="mobile-player">
          <span>PLAYER 1</span>
          <button class="control-button" data-key="w">▲</button>
          <button class="control-button" data-key="s">▼</button>
        </div>

        <div class="mobile-player">
          <span>PLAYER 2</span>
          <button class="control-button" data-key="arrowup">▲</button>
          <button class="control-button" data-key="arrowdown">▼</button>
        </div>
      </div>

      <button id="pauseButton">Pause</button>
      <button id="restartButton">Restart Game</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreElement = document.getElementById("leftScore");
    const rightScoreElement = document.getElementById("rightScore");
    const pauseButton = document.getElementById("pauseButton");
    const restartButton = document.getElementById("restartButton");
    const controlButtons = document.querySelectorAll(".control-button");

    const paddleWidth = 14;
    const paddleHeight = 100;
    const paddleSpeed = 7;
    const ballSize = 12;

    const leftPaddle = {
      x: 25,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      dy: 0
    };

    const rightPaddle = {
      x: canvas.width - 25 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      dy: 0
    };

    const ball = {
      x: canvas.width / 2 - ballSize / 2,
      y: canvas.height / 2 - ballSize / 2,
      size: ballSize,
      dx: 5,
      dy: 3
    };

    let leftScore = 0;
    let rightScore = 0;
    let paused = false;

    const keys = {};

    document.addEventListener("keydown", (event) => {
      keys[event.key.toLowerCase()] = true;

      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
      }

      if (event.code === "Space") {
        paused = !paused;
        pauseButton.textContent = paused ? "Resume" : "Pause";
      }
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    controlButtons.forEach((button) => {
      const key = button.dataset.key;

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys[key] = true;
      });

      button.addEventListener("pointerup", (event) => {
        event.preventDefault();
        keys[key] = false;
      });

      button.addEventListener("pointerleave", () => {
        keys[key] = false;
      });

      button.addEventListener("pointercancel", () => {
        keys[key] = false;
      });
    });

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
    });

    restartButton.addEventListener("click", resetGame);

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2 - ball.size / 2;
      ball.y = canvas.height / 2 - ball.size / 2;
      ball.dx = 5 * direction;
      ball.dy = (Math.random() > 0.5 ? 1 : -1) * 3;
    }

    function resetGame() {
      leftScore = 0;
      rightScore = 0;

      leftScoreElement.textContent = leftScore;
      rightScoreElement.textContent = rightScore;

      leftPaddle.y = canvas.height / 2 - paddleHeight / 2;
      rightPaddle.y = canvas.height / 2 - paddleHeight / 2;

      paused = false;
      pauseButton.textContent = "Pause";

      resetBall(Math.random() > 0.5 ? 1 : -1);
    }

    function updatePaddles() {
      leftPaddle.dy = 0;
      rightPaddle.dy = 0;

      if (keys["w"]) {
        leftPaddle.dy = -paddleSpeed;
      }

      if (keys["s"]) {
        leftPaddle.dy = paddleSpeed;
      }

      if (keys["arrowup"]) {
        rightPaddle.dy = -paddleSpeed;
      }

      if (keys["arrowdown"]) {
        rightPaddle.dy = paddleSpeed;
      }

      leftPaddle.y += leftPaddle.dy;
      rightPaddle.y += rightPaddle.dy;

      leftPaddle.y = Math.max(
        0,
        Math.min(canvas.height - leftPaddle.height, leftPaddle.y)
      );

      rightPaddle.y = Math.max(
        0,
        Math.min(canvas.height - rightPaddle.height, rightPaddle.y)
      );
    }

    function isColliding(paddle) {
      return (
        ball.x < paddle.x + paddle.width &&
        ball.x + ball.size > paddle.x &&
        ball.y < paddle.y + paddle.height &&
        ball.y + ball.size > paddle.y
      );
    }

    function updateBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y <= 0 || ball.y + ball.size >= canvas.height) {
        ball.dy *= -1;
      }

      if (isColliding(leftPaddle) && ball.dx < 0) {
        ball.x = leftPaddle.x + leftPaddle.width;

        const paddleCenter = leftPaddle.y + leftPaddle.height / 2;
        const ballCenter = ball.y + ball.size / 2;
        const hitPosition =
          (ballCenter - paddleCenter) / (paddleHeight / 2);

        ball.dx = Math.abs(ball.dx) + 0.25;
        ball.dy = hitPosition * 5;
      }

      if (isColliding(rightPaddle) && ball.dx > 0) {
        ball.x = rightPaddle.x - ball.size;

        const paddleCenter = rightPaddle.y + rightPaddle.height / 2;
        const ballCenter = ball.y + ball.size / 2;
        const hitPosition =
          (ballCenter - paddleCenter) / (paddleHeight / 2);

        ball.dx = -Math.abs(ball.dx) - 0.25;
        ball.dy = hitPosition * 5;
      }

      if (ball.x + ball.size < 0) {
        rightScore++;
        rightScoreElement.textContent = rightScore;
        resetBall(-1);
      }

      if (ball.x > canvas.width) {
        leftScore++;
        leftScoreElement.textContent = leftScore;
        resetBall(1);
      }
    }

    function drawCourt() {
      ctx.fillStyle = "#05080c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.setLineDash([12, 16]);
      ctx.strokeStyle = "#526273";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#28a9e0";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
    }

    function drawPausedMessage() {
      if (!paused) return;

      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.font = "bold 32px Arial";
      ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);

      ctx.font = "16px Arial";
      ctx.fillText(
        "Press Pause or Space to resume",
        canvas.width / 2,
        canvas.height / 2 + 35
      );
    }

    function gameLoop() {
      if (!paused) {
        updatePaddles();
        updateBall();
      }

      drawCourt();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
      drawPausedMessage();

      requestAnimationFrame(gameLoop);
    }

    resetGame();
    gameLoop();
  </script>
</body>
</html>
